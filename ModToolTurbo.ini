; SM ModTool Turbo configuration.
; Place this file next to d3d11.dll (the ModTool Release folder).

[General]
; 1 = write ModToolTurbo.log next to the DLL, 0 = no log file.
Log=1

[Upload]
; 1 = do not ask for confirmation before overwriting a Workshop item,
;     and do not ask "upload anyway?" when the content has errors.
AutoConfirm=1

[Compile]
; 1 = skip ContentCompiler when the mod content has not changed since the
;     last successful compile (uses Cache and a local fingerprint database).
SkipUnchanged=1

; 1 = always run ContentCompiler, even when SkipUnchanged is 1.
Force=0

; 1 = run ContentCompiler above normal priority.
PriorityBoost=1

; 1 = skip ContentCompiler entirely and go straight to the Workshop
;     upload. No icon/cache generation and no content validation.
;     Use only when the mod folder is already ready to publish.
SkipCompiler=0

; 1 = pass --dont-overwrite-icons to the single ContentCompiler process.
;     Existing stock icons are reused and only missing icons are rendered.
;     Set 0 if the mod's generated icons can become stale.
ReuseIcons=0
